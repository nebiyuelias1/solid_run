name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    container: ruby:3.4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Tests
        run: |
          echo "🚀 Solid Run running test suite inside Docker..."
          bundle install --quiet
          bin/rails db:test:prepare
          bin/rails test
