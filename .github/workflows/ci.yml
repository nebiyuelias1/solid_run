name: Local CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    container: ruby:3.4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Echo Status
        run: |
          echo "🚀 Local CI is running via act!"
          ruby -v

      - name: Run Ruby Tests
        run: |
          bundle install
          bundle exec ruby -Ilib:test -e 'Dir["test/**/*_test.rb"].each { |f| require_relative f }'
